<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand text-primary" href="Home.html">Go2upSkills</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav">
          <li class="nav-item"><a class="nav-link" href="Home.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="Course.html">Course</a></li>
          <li class="nav-item"><a class="nav-link" href="Register.html">Register</a></li>
        </ul>
      </div>
    </div>
  </nav>


  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-8 col-lg-5">
        <h2 class="text-center mb-4">Register</h2>

        <form id="registerForm" novalidate>
          <div class="mb-3">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="fullName" required>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" class="form-control" id="email" required>

          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" pattern="[0-9]{9,10}" required>
          </div>

          <div class="mb-3">
            <label for="course" class="form-label">Select Course</label>
            <select class="form-select" id="course" required>
              <option value="" selected disabled></option>
              <option>Course Web Development</option>
              <option>Course Python Programming</option>
              <option>Course Power BI</option>
              <option>Course Web Development</option>
              <option>Course Python Programming</option>
              <option>Course Power BI</option>
            </select>
          </div>

          <button type="submit" class="btn btn-primary">Register</button>
        </form>

        <div id="successMsg" class="alert alert-success mt-4 d-none"></div>
      </div>
    </div>
  </main>

<footer class="bg-body-tertiary text-center py-3 small">
        <div class="mb-1"></div>
        <div>©69707645 Supawit 2026 </div>
      </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
